<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c6fd0"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaeaea"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#848484"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bot)"/>

  <!-- 立方体 -->
  <g transform="translate(0,-6)">
    <path d="M60 30 L96 50 L60 70 L24 50 Z" fill="url(#top)"/>
    <path d="M24 50 L60 70 L60 108 L24 88 Z" fill="url(#left)"/>
    <path d="M96 50 L60 70 L60 108 L96 88 Z" fill="url(#right)"/>
  </g>

  <!-- 向下箭头徽标：表示“装到本地” -->
  <g transform="translate(84,82)">
    <circle cx="16" cy="16" r="17" fill="#ffffff"/>
    <circle cx="16" cy="16" r="17" fill="none" stroke="#1c6fd0" stroke-opacity="0.15" stroke-width="1.5"/>
    <path d="M16 7 L16 21" stroke="#1c6fd0" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M9.5 15.5 L16 22 L22.5 15.5" fill="none" stroke="#1c6fd0"
          stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
